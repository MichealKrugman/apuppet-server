# aPuppet web-admin + Janus REST proxy.
# Installed to /etc/nginx/sites-available/apuppet.conf on the host.
# Deliberately only touches the apuppet.mainstreetmint.sbs server name so no
# other vhost on this nginx is affected.

# Stage 1: HTTP only, ACME challenge only. Used to obtain the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name apuppet.mainstreetmint.sbs;

    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

