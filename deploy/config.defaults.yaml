---

## Janus
# REST API
# Closed 2026-10-22 (Micheal approved): the client and web-admin use only
# wss :8989 through nginx :443. The Janus HTTP/HTTPS API ports were bound on
# the public interface and are an unnecessary attack surface. Keep the port
# vars for the templates; re-enable only with a firewall in front.
api_http: false
api_http_port: 8088

# REST API (secure)
api_https: false
api_https_port: 8089

# Admin REST API (Secure)
admin_api_https: false
admin_api_https_port: 7889

# Websockets API (Secure)
api_wss: true
api_wss_port: 8989

## Nginx
is_nginx_enabled: true
web_http_port: 80
web_https_port: 443

## RTP
rtp_port_range: 10000-10500

## SSL and Certbot
is_certbot_enabled: true
# Share your email with EFF (Electronic Frontier Foundation, a founding partner of the Let's Encrypt project and the non-profit organization that develops Certbot
share_email: true
