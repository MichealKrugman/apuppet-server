---

- name: Switch to prepare aPuppet
  import_playbook: pre_apuppet.yaml

- name: Start aPuppet
  hosts: localhost
  connection: local
  vars_files:
    - config.build.yaml
    - config.defaults.yaml
    - ../config.yaml

  tasks:
    - set_fact:
        ssl_enabled: "{% if is_certbot_enabled %}true{% else %}false{% endif %}"

    # community.docker 3.x+: docker-compose v1 (and its Ansible module) is
    # dead upstream; the server only has the Compose v2 plugin. "state:
    # restarted" only restarts containers that already exist, so a cold start
    # created nothing -- recreate: always gives the original "start if absent,
    # restart if running" behaviour of the v1 module.
    - name: (Re)Starting aPuppet
      community.docker.docker_compose_v2:
        project_src: ../
        state: present
        recreate: always

    - name: Welcome!
      debug:
        msg:
          - "To control your mobile devices remotely, install the aPuppet Android agent and use the following server URL and secret:"
          - "{% if ssl_enabled %}https{% else %}http{% endif %}://{{ hostname }}/web-admin/"
          - "API Secret: {{ janus_api_secret }}"
